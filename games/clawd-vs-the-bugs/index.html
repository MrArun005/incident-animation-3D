<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}</style></head><body>
<title>Clawd vs The Bugs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: a tall arcade cabinet. HUD strip on top, the 2:3 playfield below, overlays sit on the playfield. */
:root {
  --ink: #0f0d16;       /* cabinet black, slightly violet */
  --panel: #1a1626;
  --line: #3a3252;
  --clawd: #cc7f61;     /* Clawd's own orange */
  --clawd-hi: #e8a688;
  --paper: #f3ecdf;
  --dim: #9086a6;
  --bolt: #ffe08a;
  --hot: #ff5c7a;
  --px: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--px); box-sizing: border-box; padding-inline: 16px; padding-block: 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: none; }
.hud { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; font-size: 9px; line-height: 1.4; width: 100%; max-width: 560px; }
.hud b { color: var(--clawd-hi); font-weight: 400; }
.hud .num { display: inline-block; min-width: 6ch; text-align: right; font-variant-numeric: tabular-nums; color: var(--paper); }
.hud .grp { display: flex; align-items: center; gap: 6px; }
.hud .btns { display: flex; gap: 6px; }
button { font: inherit; font-family: var(--px); font-size: 9px; color: var(--paper); background: var(--panel); border: 2px solid var(--line); padding: 6px 8px; cursor: pointer; }
button:hover { border-color: var(--clawd); }
button:focus-visible { outline: 2px solid var(--bolt); outline-offset: 2px; }
button.go { font-size: 12px; padding: 12px 18px; background: var(--clawd); color: #1a0f0a; border-color: var(--clawd-hi); }
button.go:hover { background: var(--clawd-hi); }
#mult { color: var(--bolt); min-width: 3ch; }
.stage { position: relative; flex: 0 0 auto; }
canvas#cv { display: block; image-rendering: pixelated; background: #0b0912; border: 2px solid var(--line); }
.ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 16px; background: rgba(15, 13, 22, 0.78); }
.ov[hidden] { display: none; }
.ov h1 { margin: 0; font-weight: 400; font-size: 34px; line-height: 1.1; color: var(--clawd); text-shadow: 3px 3px 0 #5b2f1f; text-wrap: balance; }
.ov h2 { margin: 0; font-weight: 400; font-size: 20px; color: var(--hot); text-shadow: 2px 2px 0 #4b1626; }
.ov p { margin: 0; font-size: 9px; line-height: 1.9; color: var(--dim); max-width: 34ch; }
.ov p em { font-style: normal; color: var(--paper); }
.ov .sub { font-size: 12px; color: var(--paper); }
.ov .score { font-size: 16px; color: var(--bolt); font-variant-numeric: tabular-nums; }
#banner { position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; font-size: 16px; color: var(--paper); text-shadow: 3px 3px 0 #000; transition: opacity 0.25s; opacity: 0; }
#banner.on { opacity: 1; }
#banner small { display: block; margin-top: 10px; font-size: 9px; color: var(--clawd-hi); }
@media (prefers-reduced-motion: reduce) { #banner { transition: none; } }
</style>

<div class="hud" id="hud">
  <div class="grp"><span><b>SCORE</b> <span class="num" id="hScore">0</span></span><span><b>BEST</b> <span class="num" id="hHi">0</span></span></div>
  <div class="grp"><span><b>WAVE</b> <span id="hWave">1</span></span><canvas id="life" width="22" height="22" style="width:18px;height:18px;image-rendering:pixelated" aria-hidden="true"></canvas><span id="hLives">x3</span><span id="mult" title="Combo multiplier"></span></div>
  <div class="btns"><button id="bPause" type="button">PAUSE</button><button id="bMute" type="button">SOUND ON</button></div>
</div>

<div class="stage" id="stage">
  <canvas id="cv" width="240" height="360" aria-label="Clawd vs The Bugs playfield"></canvas>
  <div id="banner" aria-live="polite"></div>
  <div class="ov" id="ovTitle">
    <h1>CLAWD<br><span style="font-size:14px;color:var(--paper);text-shadow:none">vs the bugs</span></h1>
    <p><em>Move</em> with the mouse, arrows or A/D, or drag a finger.<br><em>Fire</em> with Space, click or hold a touch.<br>Grab <em>S</em> spread, <em>R</em> rapid, <em>H</em> shield, <em>B</em> bomb.</p>
    <p id="tBest"></p>
    <button class="go" id="bStart" type="button">START</button>
  </div>
  <div class="ov" id="ovPause" hidden><h2 style="color:var(--paper);text-shadow:none">PAUSED</h2><p>Press P or tap Resume.</p><button class="go" id="bResume" type="button">RESUME</button></div>
  <div class="ov" id="ovOver" hidden><h2>BUILD FAILED</h2><p class="sub" id="oWave"></p><div class="score" id="oScore"></div><p id="oBest"></p><button class="go" id="bAgain" type="button">PLAY AGAIN</button></div>
</div>

<script>
(() => {
'use strict';
const W = 240, H = 360, DEAD = H - 46;
const $ = (id) => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let hi = +store.get('clawd-bugs-hi') || 0;

/* ---------- sprites: drawn small, kept as pixel-perfect canvases ---------- */
const pad = (rows) => { const w = Math.max(...rows.map((r) => r.length)); return rows.map((r) => r.padEnd(w, '.')); };
const mk = (rows, pal, flash) => { rows = pad(rows); const c = document.createElement('canvas'); c.width = rows[0].length * 2; c.height = rows.length * 2; const x = c.getContext('2d'); rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === '.') return; x.fillStyle = flash ? '#fff' : pal[ch]; x.fillRect(i * 2, j * 2, 2, 2); })); return c; };
const both = (rows, pal) => ({ n: mk(rows, pal, false), f: mk(rows, pal, true) });
const CPAL = { o: '#cc7f61', h: '#e8a688', e: '#1a0f0a', w: '#ffe08a' };
const clawdRows = (legs, arm) => {
  const r = ['.hhhhhhhhh.', '.ooooooooo.', '.ooooooooo.', 'ooeoooooeoo', 'ooeoooooeoo', '.ooooooooo.', '.ooooooooo.', '.ooooooooo.', legs, legs, legs];
  if (arm) { r[3] = 'ooeoooooeo.'; r[4] = 'ooeoooooeo.'; r[1] = '.oooooooooo'; r[2] = '.oooooooooo'; }
  return r;
};
const CL = [both(clawdRows('.o.o...o.o.'), CPAL), both(clawdRows('..o.o.o.o..'), CPAL), both(clawdRows('.o.o...o.o.', true), CPAL), both(clawdRows('..o.o.o.o..', true), CPAL)];
const GNAT = { pal: { a: '#4fd1c5', b: '#ffffff' }, A: ['..a...a..', '...a.a...', '..aaaaa..', '.aabaabaa', 'aaaaaaaaa', '.a.aaa.a.', 'a...a...a'], B: ['..a...a..', '...a.a...', '..aaaaa..', '.aabaabaa', 'aaaaaaaaa', 'a.aaaaa.a', '.a.....a.'] };
const BEETLE = { pal: { d: '#a78bfa', c: '#ddd3ff', b: '#ffffff' }, A: ['..c.....c..', '...c...c...', '..ddddddd..', '.ddddddddd.', 'ddbdddddbdd', 'ddddcccdddd', '.ddddddddd.', '..d.d.d.d..', '.d.......d.'], B: ['..c.....c..', '...c...c...', '..ddddddd..', '.ddddddddd.', 'ddbdddddbdd', 'ddddcccdddd', '.ddddddddd.', '..d.d.d.d..', '..d.....d..'] };
const SPIDER = { pal: { p: '#f472b6', b: '#ffffff' }, A: ['..p.....p..', '...p...p...', 'p...ppp...p', '.p.ppppp.p.', '..ppbpbpp..', '.p.ppppp.p.', 'p...ppp...p', 'p.........p'], B: ['..p.....p..', '...p...p...', 'p...ppp...p', '.p.ppppp.p.', '..ppbpbpp..', '.p.ppppp.p.', '.p..ppp..p.', '.p.......p.'] };
const SP = {};
for (const [k, d] of Object.entries({ gnat: GNAT, beetle: BEETLE, spider: SPIDER })) SP[k] = [both(d.A, d.pal), both(d.B, d.pal)];
const LIFE_ICON = $('life').getContext('2d'); LIFE_ICON.drawImage(CL[0].n, 0, 0);
const TYPES = {
  gnat: { hp: 1, w: 18, h: 14, pts: 10, col: '#4fd1c5' },
  beetle: { hp: 2, w: 22, h: 18, pts: 25, col: '#a78bfa' },
  spider: { hp: 3, w: 22, h: 16, pts: 50, col: '#f472b6' },
};

/* ---------- audio: tiny synth, started by the first tap or key ---------- */
let ac = null, muted = false;
const audioInit = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } } if (ac && ac.state === 'suspended') ac.resume(); };
function tone(f0, f1, d, type = 'square', v = 0.05) {
  if (!ac || muted) return; const t = ac.currentTime, o = ac.createOscillator(), gn = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + d);
  gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(gn); gn.connect(ac.destination); o.start(t); o.stop(t + d + 0.03);
}
function noise(d, v = 0.12, fc = 1800) {
  if (!ac || muted) return; const n = (ac.sampleRate * d) | 0, b = ac.createBuffer(1, n, ac.sampleRate), a = b.getChannelData(0);
  for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2;
  const s = ac.createBufferSource(); s.buffer = b; const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fc; const gn = ac.createGain(); gn.gain.value = v; s.connect(f); f.connect(gn); gn.connect(ac.destination); s.start();
}
const sfx = {
  shoot: () => tone(920, 420, 0.07, 'square', 0.025), hit: () => tone(240, 110, 0.06, 'square', 0.04),
  boom: () => { noise(0.28, 0.14, 1600); tone(150, 45, 0.2, 'square', 0.05); }, big: () => { noise(0.9, 0.3, 1400); tone(110, 30, 0.7, 'sawtooth', 0.09); },
  pick: () => [660, 880, 1320].forEach((f, i) => setTimeout(() => tone(f, f, 0.08, 'square', 0.04), i * 60)),
  hurt: () => { tone(520, 60, 0.45, 'sawtooth', 0.08); noise(0.3, 0.16, 900); }, life: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, f, 0.1, 'square', 0.045), i * 80)),
  wave: () => [392, 523, 659].forEach((f, i) => setTimeout(() => tone(f, f, 0.12, 'square', 0.04), i * 90)), over: () => [392, 330, 262, 196].forEach((f, i) => setTimeout(() => tone(f, f * 0.96, 0.25, 'square', 0.05), i * 190)),
};
let step = 0, musicTimer = 0;
const BASS = [55, 55, 82, 55, 65, 65, 98, 65, 73, 73, 110, 73, 49, 49, 73, 49];
function music() {
  clearTimeout(musicTimer);
  if (state === 'play' && ac && !muted) { const f = BASS[step % 16]; tone(f, f, 0.12, 'triangle', 0.09); if (step % 2 === 1) noise(0.03, 0.05, 7000); if (step % 4 === 0 && wave > 2) tone(f * 4, f * 4, 0.06, 'square', 0.015); step++; }
  musicTimer = setTimeout(music, Math.max(85, 165 - wave * 6));
}

/* ---------- state ---------- */
let state = 'title', wave = 1, score = 0, lives = 3, combo = 0, lastKill = -9, nextLife = 2500, clock = 0, shake = 0, flashT = 0;
let p, bullets, ebul, enemies, pups, parts, pops, queue, wt, spawned, waveGap, boss, bossN;
const stars = [0, 1, 2].map((l) => Array.from({ length: 26 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 10 + l * 22, z: l })));
const rnd = (a, b) => a + Math.random() * (b - a);
const hit = (a, b) => Math.abs(a.x - b.x) * 2 < a.w + b.w && Math.abs(a.y - b.y) * 2 < a.h + b.h;
function reset() {
  p = { x: W / 2, y: H - 30, w: 12, h: 14, cd: 0, inv: 0, shield: false, spread: 0, rapid: 0, fr: 0, fire: 0 };
  bullets = []; ebul = []; enemies = []; pups = []; parts = []; pops = []; boss = null; bossN = 0;
  wave = 1; score = 0; lives = 3; combo = 0; lastKill = -9; nextLife = 2500; startWave();
}
function startWave() {
  spawned = 0; wt = 0; waveGap = 0; queue = [];
  if (wave % 5 === 0) {
    bossN++; const hp = 24 + bossN * 14; boss = { t: 'boss', x: W / 2, y: -34, w: 52, h: 30, hp, max: hp, ph: 0, cd: 1.6, fl: 0, sp: 0 }; enemies.push(boss);
    for (let i = 0; i < 8; i++) queue.push({ t: 'gnat', at: 3 + i * 1.1 });
    banner('BOSS: SEGFAULT', 'wave ' + wave);
  } else {
    const n = 7 + wave * 3, gap = Math.max(0.28, 0.95 - wave * 0.05);
    for (let i = 0; i < n; i++) { const r = Math.random(); queue.push({ t: wave >= 3 && r < 0.12 + wave * 0.01 ? 'spider' : wave >= 2 && r < 0.38 ? 'beetle' : 'gnat', at: 0.6 + i * gap }); }
    banner('WAVE ' + wave, wave === 1 ? 'squash them' : wave >= 3 ? 'spiders shoot back' : 'more of them');
  }
  sfx.wave();
}
function spawn(t) {
  const d = TYPES[t], e = { t, x: rnd(18, W - 18), y: -16, w: d.w, h: d.h, hp: d.hp + (wave > 7 && t !== 'gnat' ? 1 : 0), ph: rnd(0, 6), fl: 0, cd: rnd(0.8, 1.8), base: 0 };
  e.base = e.x; enemies.push(e);
}
let bannerT = 0;
function banner(a, b) { const el = $('banner'); el.innerHTML = a + (b ? '<small>' + b + '</small>' : ''); el.classList.add('on'); clearTimeout(bannerT); bannerT = setTimeout(() => el.classList.remove('on'), 1700); }

/* ---------- actions ---------- */
function burst(x, y, col, n = 10, sp = 90, big = false) { for (let i = 0; i < n; i++) { const a = rnd(0, 6.283), s = rnd(sp * 0.3, sp); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, life: rnd(0.3, big ? 0.9 : 0.55), t: 0, col, s: Math.random() < 0.3 ? 3 : 2 }); } }
function popup(x, y, txt, col = '#ffe08a') { pops.push({ x, y, txt, col, t: 0 }); }
function addScore(base, x, y) {
  combo = clock - lastKill < 1.4 ? Math.min(combo + 1, 9) : 0; lastKill = clock;
  const m = 1 + Math.floor(combo / 3), pts = base * m; score += pts; popup(x, y - 8, '+' + pts);
  if (score >= nextLife) { nextLife += 2500; if (lives < 5) { lives++; sfx.life(); popup(p.x, p.y - 24, '1UP', '#7cf0a0'); } }
}
function kill(e) {
  if (e.t === 'boss') { burst(e.x, e.y, '#f87171', 60, 200, true); burst(e.x, e.y, '#ffe08a', 30, 140, true); sfx.big(); shake = 0.7; addScore(1000 * bossN, e.x, e.y); pups.push({ x: e.x - 16, y: e.y, k: 'H', vy: 30 }, { x: e.x + 16, y: e.y, k: 'B', vy: 30 }); boss = null; ebul.length = 0; banner('SEGFAULT FIXED', '+' + 1000 * bossN); }
  else { const d = TYPES[e.t]; burst(e.x, e.y, d.col, 12); sfx.boom(); addScore(d.pts, e.x, e.y); if (Math.random() < (e.t === 'spider' ? 0.35 : 0.09)) pups.push({ x: e.x, y: e.y, k: 'SRHB'[(Math.random() * 4) | 0], vy: 32 }); }
  e.dead = true;
}
function damage(e, n = 1) { e.hp -= n; e.fl = 0.08; if (e.hp <= 0) kill(e); else sfx.hit(); }
function hurt() {
  if (p.inv > 0 || state !== 'play') return;
  if (p.shield) { p.shield = false; p.inv = 0.9; sfx.pick(); burst(p.x, p.y, '#7cd0ff', 16); return; }
  lives--; p.inv = 1.9; shake = 0.45; sfx.hurt(); burst(p.x, p.y, '#cc7f61', 22, 130); combo = 0;
  if (lives <= 0) gameOver();
}
function bomb() { flashT = 0.3; shake = 0.5; sfx.big(); ebul.length = 0; enemies.forEach((e) => { if (e.t === 'boss') damage(e, 12); else kill(e); }); }
function collect(k) {
  sfx.pick();
  if (k === 'S') { p.spread = 10; popup(p.x, p.y - 22, 'SPREAD', '#ffe08a'); } if (k === 'R') { p.rapid = 10; popup(p.x, p.y - 22, 'RAPID', '#ffe08a'); }
  if (k === 'H') { p.shield = true; popup(p.x, p.y - 22, 'SHIELD', '#7cd0ff'); } if (k === 'B') { popup(p.x, p.y - 22, 'BOMB', '#ff9a5c'); bomb(); }
}
function fireShot() {
  const s = p.spread > 0 ? [-58, 0, 58] : [0];
  s.forEach((vx) => bullets.push({ x: p.x + vx * 0.06, y: p.y - 12, vx, vy: -330, w: 3, h: 8 })); sfx.shoot(); p.cd = p.rapid > 0 ? 0.085 : 0.2; p.fire = 0.08;
}
function ebullet(x, y, tx, ty, sp) { const a = Math.atan2(ty - y, tx - x); ebul.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: 5, h: 5 }); }

/* ---------- input ---------- */
const keys = new Set(); const ptr = { down: false, x: null };
const toGame = (e) => { const r = cv.getBoundingClientRect(); return ((e.clientX - r.left) / r.width) * W; };
window.addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  audioInit(); keys.add(e.code);
  if ((e.code === 'Enter' || e.code === 'Space') && (state === 'title' || state === 'over')) start();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause(); if (e.code === 'KeyM') toggleMute();
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
cv.addEventListener('pointerdown', (e) => { audioInit(); ptr.down = true; ptr.x = toGame(e); try { cv.setPointerCapture(e.pointerId); } catch (x) {} });
cv.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || ptr.down) ptr.x = toGame(e); });
['pointerup', 'pointercancel'].forEach((n) => cv.addEventListener(n, () => { ptr.down = false; }));
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });
window.addEventListener('blur', () => { keys.clear(); ptr.down = false; if (state === 'play') togglePause(); });
function show(id, on) { $(id).hidden = !on; }
function start() { audioInit(); reset(); state = 'play'; show('ovTitle', false); show('ovOver', false); show('ovPause', false); step = 0; }
function togglePause() { if (state === 'play') { state = 'pause'; show('ovPause', true); $('bPause').textContent = 'RESUME'; } else if (state === 'pause') { state = 'play'; show('ovPause', false); $('bPause').textContent = 'PAUSE'; } }
function toggleMute() { muted = !muted; $('bMute').textContent = muted ? 'SOUND OFF' : 'SOUND ON'; }
function gameOver() {
  state = 'over'; sfx.over(); const nb = score > hi; if (nb) { hi = score; store.set('clawd-bugs-hi', String(hi)); }
  $('oWave').textContent = 'Reached wave ' + wave; $('oScore').textContent = String(score).padStart(6, '0'); $('oBest').textContent = nb ? 'NEW BEST SCORE' : 'Best ' + hi; show('ovOver', true); ptr.down = false;
}
$('bStart').onclick = () => { start(); $('bStart').blur(); }; $('bAgain').onclick = () => { start(); $('bAgain').blur(); };
$('bResume').onclick = () => { togglePause(); $('bResume').blur(); }; $('bPause').onclick = () => { if (state === 'play' || state === 'pause') togglePause(); $('bPause').blur(); }; $('bMute').onclick = () => { audioInit(); toggleMute(); $('bMute').blur(); };

/* ---------- update ---------- */
function update(dt) {
  clock += dt;
  stars.forEach((L) => L.forEach((s) => { s.y += s.s * dt * (state === 'play' ? 1 : 0.5); if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }));
  if (state !== 'play') return;
  shake = Math.max(0, shake - dt); flashT = Math.max(0, flashT - dt);
  const L = keys.has('ArrowLeft') || keys.has('KeyA'), R = keys.has('ArrowRight') || keys.has('KeyD');
  if (L || R) p.x += ((R ? 1 : 0) - (L ? 1 : 0)) * 140 * dt; else if (ptr.x != null) { const d = ptr.x - p.x; p.x += Math.sign(d) * Math.min(Math.abs(d), 260 * dt); }
  p.x = Math.max(11, Math.min(W - 11, p.x)); p.fr += dt * 9; p.inv = Math.max(0, p.inv - dt); p.spread = Math.max(0, p.spread - dt); p.rapid = Math.max(0, p.rapid - dt); p.cd -= dt; p.fire = Math.max(0, p.fire - dt);
  if ((keys.has('Space') || keys.has('ArrowUp') || keys.has('KeyW') || keys.has('KeyZ') || ptr.down) && p.cd <= 0) fireShot();
  // spawning
  wt += dt; while (spawned < queue.length && queue[spawned].at <= wt) spawn(queue[spawned++].t);
  // player bullets
  bullets.forEach((b) => { b.x += b.vx * dt; b.y += b.vy * dt; if (b.y < -10 || b.x < -5 || b.x > W + 5) b.dead = true; });
  // enemies
  for (const e of enemies) {
    e.ph += dt; e.fl = Math.max(0, e.fl - dt);
    if (e.t === 'gnat') { e.y += (36 + wave * 2.2) * dt; e.x = e.base + Math.sin(e.ph * 2.2) * 30; }
    else if (e.t === 'beetle') { e.y += (26 + wave * 1.6) * dt; e.x = e.base + Math.sin(e.ph * 1.1) * 14; }
    else if (e.t === 'spider') { if (e.y < 60 + (e.base % 40)) e.y += 40 * dt; else e.y += 6 * dt; e.x = e.base + Math.sin(e.ph * 1.4) * 44; e.cd -= dt; if (e.cd <= 0) { e.cd = Math.max(0.9, 2.1 - wave * 0.07); ebullet(e.x, e.y + 8, p.x + rnd(-14, 14), p.y, 88 + wave * 3); } }
    else if (e.t === 'boss') {
      e.y += Math.min(60 - e.y, 40 * dt); e.x = W / 2 + Math.sin(e.ph * (e.hp < e.max / 2 ? 1.3 : 0.85)) * 72; e.cd -= dt;
      if (e.cd <= 0 && e.y > 30) { const rage = e.hp < e.max / 2; e.cd = rage ? 1.0 : 1.5; const n = rage ? 5 : 3; for (let i = 0; i < n; i++) { const a = 1.5708 + (i - (n - 1) / 2) * 0.32; ebul.push({ x: e.x, y: e.y + 14, vx: Math.cos(a) * 92, vy: Math.sin(a) * 92, w: 5, h: 5 }); } if (rage && Math.random() < 0.35) { spawn('gnat'); enemies[enemies.length - 1].y = e.y + 10; enemies[enemies.length - 1].base = e.x; } }
    }
    if (!e.dead && e.t !== 'boss' && e.y > DEAD) { e.dead = true; burst(e.x, e.y, '#ff5c7a', 8); hurt(); }
    if (!e.dead && hit(e, p) && e.t !== 'boss') { kill(e); hurt(); }
    if (!e.dead && e.t === 'boss' && hit({ x: e.x, y: e.y, w: e.w - 6, h: e.h - 6 }, p)) hurt();
  }
  // bullets vs enemies
  for (const b of bullets) { if (b.dead) continue; for (const e of enemies) { if (!e.dead && hit(b, e)) { b.dead = true; damage(e); break; } } }
  // enemy bullets
  ebul.forEach((b) => { b.x += b.vx * dt; b.y += b.vy * dt; if (b.y > H + 6 || b.x < -6 || b.x > W + 6) b.dead = true; else if (hit(b, { x: p.x, y: p.y + 1, w: 8, h: 12 })) { b.dead = true; hurt(); } });
  // pickups
  pups.forEach((u) => { u.y += u.vy * dt; if (u.y > H + 8) u.dead = true; else if (hit({ x: u.x, y: u.y, w: 14, h: 14 }, p)) { u.dead = true; collect(u.k); } });
  parts.forEach((q) => { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 160 * dt; q.vx *= 0.985; });
  pops.forEach((q) => { q.t += dt; q.y -= 22 * dt; });
  bullets = bullets.filter((b) => !b.dead); ebul = ebul.filter((b) => !b.dead); enemies = enemies.filter((e) => !e.dead); pups = pups.filter((u) => !u.dead); parts = parts.filter((q) => q.t < q.life); pops = pops.filter((q) => q.t < 0.8);
  if (spawned >= queue.length && enemies.length === 0) { waveGap += dt; if (waveGap > 1.6) { wave++; startWave(); } }
}

/* ---------- draw ---------- */
function drawBoss(e) {
  const x = Math.round(e.x), y = Math.round(e.y), fl = e.fl > 0, body = fl ? '#fff' : '#f87171', dark = fl ? '#fff' : '#a13a3a', mand = Math.sin(e.ph * 6) > 0 ? 2 : 0;
  g.fillStyle = dark; for (let i = -1; i <= 1; i++) { g.fillRect(x - 30, y + 2 + i * 8 + (Math.sin(e.ph * 5 + i) > 0 ? 1 : 0), 8, 2); g.fillRect(x + 22, y + 2 + i * 8 + (Math.sin(e.ph * 5 + i + 2) > 0 ? 1 : 0), 8, 2); }
  g.fillStyle = body; g.fillRect(x - 24, y - 8, 48, 22); g.fillRect(x - 16, y - 16, 32, 10); g.fillStyle = dark; g.fillRect(x - 24, y + 10, 48, 4); g.fillRect(x - 6, y - 8, 12, 2);
  g.fillStyle = '#fff'; g.fillRect(x - 12, y - 14, 9, 8); g.fillRect(x + 3, y - 14, 9, 8); const ex = Math.max(-2, Math.min(2, (p.x - e.x) / 40)); g.fillStyle = '#1a0f0a'; g.fillRect(x - 9 + ex, y - 11, 4, 5); g.fillRect(x + 6 + ex, y - 11, 4, 5);
  g.fillStyle = dark; g.fillRect(x - 10 - mand, y + 14, 4, 8); g.fillRect(x + 6 + mand, y + 14, 4, 8);
  g.fillStyle = '#3a3252'; g.fillRect(20, 6, W - 40, 5); g.fillStyle = '#f87171'; g.fillRect(20, 6, Math.max(0, (W - 40) * e.hp / e.max), 5);
}
function draw() {
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#0b0912'; g.fillRect(0, 0, W, H);
  if (shake > 0 && state === 'play') g.translate(Math.round(rnd(-1, 1) * shake * 6), Math.round(rnd(-1, 1) * shake * 6));
  stars.forEach((Ly) => Ly.forEach((s) => { g.fillStyle = ['#2a2440', '#4a4068', '#7a6ea0'][s.z]; g.fillRect(Math.round(s.x), Math.round(s.y), s.z + 1, s.z === 2 ? 2 : 1); }));
  g.fillStyle = 'rgba(255,92,122,0.35)'; for (let x = 0; x < W; x += 8) g.fillRect(x, DEAD, 4, 1);
  pups.forEach((u) => { const c = { S: '#ffe08a', R: '#ff9a5c', H: '#7cd0ff', B: '#f472b6' }[u.k], x = Math.round(u.x), y = Math.round(u.y + Math.sin(clock * 6) * 1.5); g.fillStyle = c; g.fillRect(x - 7, y - 7, 14, 14); g.fillStyle = '#0b0912'; g.fillRect(x - 5, y - 5, 10, 10); g.fillStyle = c; g.font = 'bold 9px "Courier New", monospace'; g.textAlign = 'center'; g.fillText(u.k, x, y + 3); });
  const fr = Math.floor(clock * 5) % 2;
  enemies.forEach((e) => { if (e.t === 'boss') return drawBoss(e); const s = SP[e.t][fr], im = e.fl > 0 ? s.f : s.n; g.drawImage(im, Math.round(e.x - im.width / 2), Math.round(e.y - im.height / 2)); });
  g.fillStyle = '#ff5c7a'; ebul.forEach((b) => { g.fillRect(Math.round(b.x - 2), Math.round(b.y - 2), 5, 5); g.fillStyle = '#ffd0d8'; g.fillRect(Math.round(b.x - 1), Math.round(b.y - 1), 2, 2); g.fillStyle = '#ff5c7a'; });
  g.fillStyle = '#ffe08a'; bullets.forEach((b) => { g.fillRect(Math.round(b.x - 1), Math.round(b.y - 4), 3, 8); }); g.fillStyle = '#fff'; bullets.forEach((b) => g.fillRect(Math.round(b.x), Math.round(b.y - 3), 1, 4));
  if (state === 'play' || state === 'pause' || state === 'over') {
    if (state === 'over' && lives <= 0) { /* Clawd is gone */ } else if (!(p.inv > 0 && Math.floor(clock * 20) % 2)) {
      const im = CL[((Math.floor(p.fr) % 2) + 2) % 2 + (p.fire > 0 ? 2 : 0)].n; g.drawImage(im, Math.round(p.x - 11), Math.round(p.y - 14));
      if (p.shield) { g.strokeStyle = 'rgba(124,208,255,0.9)'; g.lineWidth = 2; g.strokeRect(Math.round(p.x - 15), Math.round(p.y - 18), 30, 30); }
    }
  } else { const im = CL[Math.floor(clock * 2) % 2].n; g.drawImage(im, W / 2 - 11, H - 44 + Math.round(Math.sin(clock * 3) * 2)); [[60, 90, 'gnat'], [110, 130, 'beetle'], [170, 100, 'spider'], [80, 190, 'spider'], [150, 210, 'gnat']].forEach(([x, y, t], i) => { const im2 = SP[t][Math.floor(clock * 4 + i) % 2].n; g.drawImage(im2, x, y + Math.round(Math.sin(clock * 2 + i) * 6)); }); }
  parts.forEach((q) => { g.globalAlpha = Math.max(0, 1 - q.t / q.life); g.fillStyle = q.col; g.fillRect(Math.round(q.x), Math.round(q.y), q.s, q.s); }); g.globalAlpha = 1;
  g.font = 'bold 8px "Courier New", monospace'; g.textAlign = 'center'; pops.forEach((q) => { g.globalAlpha = 1 - q.t / 0.8; g.fillStyle = '#000'; g.fillText(q.txt, Math.round(q.x) + 1, Math.round(q.y) + 1); g.fillStyle = q.col; g.fillText(q.txt, Math.round(q.x), Math.round(q.y)); }); g.globalAlpha = 1;
  if (flashT > 0) { g.fillStyle = `rgba(255,255,255,${flashT / 0.3 * 0.8})`; g.fillRect(0, 0, W, H); }
  if (state === 'play' && (p.spread > 0 || p.rapid > 0)) { g.setTransform(1, 0, 0, 1, 0, 0); g.font = 'bold 8px "Courier New", monospace'; g.textAlign = 'left'; g.fillStyle = '#ffe08a'; let y = H - 4; if (p.spread > 0) { g.fillText('S ' + Math.ceil(p.spread), 4, y); y -= 10; } if (p.rapid > 0) { g.fillStyle = '#ff9a5c'; g.fillText('R ' + Math.ceil(p.rapid), 4, y); } }
}

/* ---------- hud, sizing, loop ---------- */
const cache = {};
const setText = (id, v) => { if (cache[id] !== v) { cache[id] = v; $(id).textContent = v; } };
function hud() { setText('hScore', String(score).padStart(6, '0')); setText('hHi', String(Math.max(hi, score)).padStart(6, '0')); setText('hWave', String(wave)); setText('hLives', 'x' + lives); const m = 1 + Math.floor(combo / 3); setText('mult', m > 1 ? 'x' + m : ''); $('tBest').textContent = hi ? 'BEST ' + String(hi).padStart(6, '0') : ''; }
function resize() {
  const hudH = $('hud').offsetHeight + 10, aw = window.innerWidth - 32 - 4, ah = window.innerHeight - hudH - 20 - 4;
  let s = Math.min(aw / W, ah / H); if (s >= 2) s = Math.floor(s * 2) / 2; s = Math.max(0.5, s);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
  const ovs = document.querySelectorAll('.ov'); ovs.forEach((o) => { o.style.fontSize = ''; });
}
window.addEventListener('resize', resize); if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
reset(); state = 'title'; resize(); hud();
let last = performance.now();
function frame(now) { const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now; update(dt); draw(); hud(); requestAnimationFrame(frame); }
requestAnimationFrame(frame); music();
window.__game = { get state() { return state; }, get score() { return score; }, get wave() { return wave; }, get lives() { return lives; }, start };
})();
</script>
